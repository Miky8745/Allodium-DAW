[package]
name = "allodium"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
xattr = { path = "vendor/xattr-0.2.3" }
