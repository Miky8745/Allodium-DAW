[package]
name = "allodium"
version = "0.1.0"
edition = "2024"

[dependencies]
# Renamed via Cargo's package-rename: gpui-kit re-exports the whole real
# `gpui` namespace (confirmed API-identical to the plain 0.2.2 we used
# before — see docs/stage-10-gpui-component.md) plus the styled
# gpui-component widget library at `gpui::component::*`. Every existing
# `use gpui::{...}` in this codebase keeps working unchanged.
gpui = { package = "gpui-kit", version = "0.9.1" }
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
symphonia = { version = "0.5", features = ["wav", "ogg", "vorbis", "mp3", "pcm", "flac"] }
rfd = "0.15"
# The toolbar's spectrum-analyzer mode (`toolbar::spectrogram`) — a real
# FFT, not a hand-rolled DFT; rustfft is the standard pure-Rust choice.
rustfft = "6"
# The File Browser's "Download Default Samples" button (`sample_downloader.rs`)
# — a plain blocking HTTPS GET on its own background thread, default
# features (pure-Rust rustls, no system OpenSSL dependency).
ureq = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
xattr = { path = "vendor/xattr-0.2.3" }
